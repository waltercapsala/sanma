<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2b5a7a">
<title>San Martín de los Andes</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#0b1a2e;font-family:'Fraunces',Georgia,serif;color:#fff}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:manipulation}
.ui{position:fixed;inset:0;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;align-items:center;text-align:center;padding:calc(env(safe-area-inset-top,0px) + 24px) 16px calc(env(safe-area-inset-bottom,0px) + 24px);text-shadow:0 2px 14px rgba(0,20,40,.6)}
h1{margin:0;font-size:clamp(28px,7vw,54px);font-weight:600;letter-spacing:.01em;line-height:1.05}
.sub{margin-top:8px;font-size:clamp(15px,3vw,19px);font-style:italic;opacity:.92}
.hint{margin-top:10px;font-size:14px;opacity:0;transition:opacity 1s}
.hint.on{opacity:.9}
.cd{display:flex;gap:10px;justify-content:center}
.u{min-width:66px;padding:11px 8px 9px;border-radius:16px;background:rgba(8,28,44,.42);border:1px solid rgba(255,255,255,.22);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.n{font-size:clamp(28px,8vw,46px);font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.l{margin-top:5px;font-size:12px;opacity:.85}
.clock{margin-top:12px;font-size:13px;opacity:.88}
.tools{position:fixed;z-index:3;top:calc(env(safe-area-inset-top,0px) + 10px);right:10px;display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.tools button{width:42px;height:42px;border-radius:50%;border:1px solid rgba(255,255,255,.3);background:rgba(8,28,44,.45);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);font-size:19px;cursor:pointer;color:#fff}
.tools button[aria-pressed="true"]{background:rgba(200,40,50,.55)}
.tools button:focus-visible,.tools input:focus-visible{outline:2px solid #ffd447;outline-offset:2px}
#pan{display:none;align-items:center;gap:8px;padding:8px 12px;border-radius:14px;background:rgba(8,28,44,.6);font-size:13px}
#pan.on{display:flex}
#pan input{width:130px}
#pan .now{width:auto;height:auto;border-radius:10px;padding:4px 9px;font-size:12px;font-family:inherit}
@media (max-width:420px){.cd{gap:7px}.u{min-width:60px}}
</style>
</head>
<body>
<canvas id="c" aria-label="Paisaje de montañas verdes, bosque y lago patagónico"></canvas>
<div class="ui">
  <div>
    <h1>San Martín de los Andes</h1>
    <div class="sub">Nuestro viaje comienza en…</div>
    <div class="hint" id="hint">Tocá las luces ✨, el cielo o a Santa 🎁</div>
  </div>
  <div>
    <div class="cd">
      <div class="u"><div class="n" id="d">--</div><div class="l">días</div></div>
      <div class="u"><div class="n" id="h">--</div><div class="l">horas</div></div>
      <div class="u"><div class="n" id="m">--</div><div class="l">min</div></div>
      <div class="u"><div class="n" id="s">--</div><div class="l">seg</div></div>
    </div>
    <div class="clock" id="clock">Hora en Bariloche: --</div>
  </div>
</div>
<div class="tools">
  <button id="bx" aria-pressed="false" aria-label="Luces navideñas" title="Luces navideñas">🎄</button>
  <button id="bt" aria-label="Probar otra hora" title="Probar otra hora">🕐</button>
  <div id="pan"><input id="rg" type="range" min="0" max="24" step="0.05" aria-label="Hora del día"><span id="hv"></span><button class="now" id="bn">Ahora</button></div>
</div>

<script>
const TARGET=new Date("2026-12-24T09:50:00-03:00");
const $=id=>document.getElementById(id);
const cv=$('c'),ctx=cv.getContext('2d');
const mtn=document.createElement('canvas'),fgc=document.createElement('canvas'),tM=document.createElement('canvas'),tF=document.createElement('canvas');
const calm=matchMedia('(prefers-reduced-motion: reduce)').matches;
let W,H,DPR,shoreY,U;
let ovr=null,xmasForce=null,xmasOn=false;

/* ---------- utilidades ---------- */
const rnd=s=>()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const lerp=(a,b,t)=>a+(b-a)*t,clamp=(v,a=0,b=1)=>Math.min(b,Math.max(a,v));
const mix=(a,b,t)=>a.map((v,i)=>lerp(v,b[i],t));
const rgba=c=>`rgba(${c[0]|0},${c[1]|0},${c[2]|0},${c.length>3?c[3].toFixed(3):1})`;
function ramp(st,x){if(x<=st[0][0])return st[0][1];for(let i=1;i<st.length;i++)if(x<=st[i][0])return mix(st[i-1][1],st[i][1],(x-st[i-1][0])/(st[i][0]-st[i-1][0]));return st[st.length-1][1]}
const SKYT=[[-.3,[4,9,26]],[-.1,[14,22,58]],[-.02,[52,62,112]],[.06,[80,110,170]],[.3,[64,132,201]],[1,[52,124,200]]];
const SKYB=[[-.3,[16,34,62]],[-.1,[40,50,92]],[-.02,[224,120,110]],[.06,[246,178,124]],[.3,[190,220,236]],[1,[205,231,240]]];
const TINT=[[-.3,[4,10,36,.62]],[-.1,[20,28,70,.5]],[-.02,[120,70,110,.3]],[.05,[255,140,80,.22]],[.2,[255,200,150,.07]],[.45,[255,255,255,0]]];
const LC=['#ff4d4d','#ffd447','#4fe07a','#59c7ff','#ff8ae2'];

/* ---------- montañas ---------- */
const R=v=>1-Math.abs(Math.sin(v));
const ridge=(x,p)=>p.b-p.a*(.5*R(x*p.f+p.s)+.3*R(x*p.f*2.3+p.s*1.7)+.2*R(x*p.f*5.1+p.s*.6));

function pineTier(x,base,h,w,i){const n=6,step=h*.86/n,ay=base-h+i*step*.9;return{ay,by:ay+step*1.7,hw:w/2*(.3+.7*(i+1)/n),step}}
function pine(c,x,base,h,w,col,dark){
  c.fillStyle=dark;c.fillRect(x-w*.04,base-h*.12,w*.08,h*.12);
  for(let i=0;i<6;i++){
    const t=pineTier(x,base,h,w,i);
    c.fillStyle=col;c.beginPath();c.moveTo(x,t.ay);c.lineTo(x-t.hw,t.by);c.lineTo(x-t.hw*.45,t.by-t.step*.22);c.lineTo(x,t.by+1);c.lineTo(x+t.hw*.45,t.by-t.step*.22);c.lineTo(x+t.hw,t.by);c.closePath();c.fill();
    c.fillStyle='rgba(0,15,10,.32)';c.beginPath();c.moveTo(x,t.ay);c.lineTo(x+t.hw,t.by);c.lineTo(x+t.hw*.45,t.by-t.step*.22);c.lineTo(x,t.by+1);c.closePath();c.fill();
  }
}

let lights=[],cabins=[];
function build(){
  const r=rnd(7);lights=[];
  mtn.width=fgc.width=tM.width=tF.width=cv.width;
  mtn.height=fgc.height=tM.height=tF.height=cv.height;
  const c=mtn.getContext('2d');c.setTransform(DPR,0,0,DPR,0,0);c.clearRect(0,0,W,H);
  const layers=[
    {p:{b:shoreY-H*.02,a:H*.30,f:.0042,s:1.3},top:'#a9c4bd',bot:'#86aa9d',k:.6},
    {p:{b:shoreY-H*.01,a:H*.26,f:.0058,s:4.1},top:'#6f9a7f',bot:'#4f7f64',k:.8},
    {p:{b:shoreY,a:H*.20,f:.0085,s:7.7},top:'#4a7a4f',bot:'#2c5238',k:1}];
  layers.forEach(L=>{
    const g=c.createLinearGradient(0,shoreY-L.p.a,0,shoreY);g.addColorStop(0,L.top);g.addColorStop(1,L.bot);
    c.fillStyle=g;c.beginPath();c.moveTo(0,shoreY+2);
    for(let x=0;x<=W+3;x+=3)c.lineTo(x,ridge(x,L.p));
    c.lineTo(W,shoreY+2);c.closePath();c.fill();
    for(let x=0;x<W;x+=3){
      const y=ridge(x,L.p),d=clamp((ridge(x+3,L.p)-y)/4,-1,1),len=L.p.a*.6;
      const gg=c.createLinearGradient(0,y,0,y+len),col=d>0?'rgba(8,32,22,':'rgba(255,240,180,';
      gg.addColorStop(0,col+(Math.abs(d)*(d>0?.4:.17)*L.k).toFixed(3)+')');gg.addColorStop(1,col+'0)');
      c.fillStyle=gg;c.fillRect(x,y,3.2,len);
    }
    const m=c.createLinearGradient(0,shoreY-L.p.a*.45,0,shoreY);m.addColorStop(0,'rgba(255,255,255,0)');m.addColorStop(1,`rgba(220,238,232,${.22*(1.1-L.k)})`);
    c.fillStyle=m;c.fillRect(0,shoreY-L.p.a*.45,W,L.p.a*.45+2);
  });
  for(let x=-10;x<W+10;x+=7+r()*8){
    const h=H*(.03+r()*.045),t=r();
    pine(c,x,shoreY+3,h,h*.45,t<.5?'#1f4230':'#26503a','#2a1d14');
  }
  // casitas
  cabins=[];
  [[.64,1],[.46,.72],[.83,.85],[.3,.6]].forEach(([fx,sc],ci)=>{
    const cw=H*.075*sc,ch=H*.04*sc,rh=H*.04*sc,cx=W*fx,by=shoreY+2;
    c.fillStyle=['#5a3b28','#6b4a30','#4f3a2c','#5d4331'][ci];c.fillRect(cx-cw/2,by-ch,cw,ch);
    c.fillStyle='rgba(0,0,0,.18)';for(let k=1;k<4;k++)c.fillRect(cx-cw/2,by-ch+k*ch/4,cw,1);
    c.fillStyle='#4a3a35';c.fillRect(cx+cw*.22,by-ch-rh*.85,cw*.1,rh*.6);
    c.fillStyle=['#2b2a2c','#3a2a2a','#25302c','#33302b'][ci];c.beginPath();c.moveTo(cx-cw*.62,by-ch);c.lineTo(cx,by-ch-rh);c.lineTo(cx+cw*.62,by-ch);c.closePath();c.fill();
    c.fillStyle='#2e1f16';c.fillRect(cx+cw*.05,by-ch*.62,cw*.2,ch*.62);
    cabins.push({x:cx-cw*.36,y:by-ch*.72,w:cw*.22,h:ch*.34});
    const eL=[cx-cw*.62,by-ch],ap=[cx,by-ch-rh],eR=[cx+cw*.62,by-ch],n=Math.max(4,Math.round(6*sc));
    for(let j=0;j<=n;j++){const f=j/n;lights.push({x:lerp(eL[0],ap[0],f),y:lerp(eL[1],ap[1],f)+2,c:(j+ci)%5,ph:r()*6,s:.6});lights.push({x:lerp(eR[0],ap[0],f),y:lerp(eR[1],ap[1],f)+2,c:(j+2+ci)%5,ph:r()*6,s:.6})}
  });
  // primer plano
  const f=fgc.getContext('2d');f.setTransform(DPR,0,0,DPR,0,0);f.clearRect(0,0,W,H);
  f.fillStyle='#173224';
  f.beginPath();f.moveTo(0,H);f.lineTo(0,H*.86);f.quadraticCurveTo(W*.16,H*.8,W*.3,H*.93);f.lineTo(W*.36,H);f.fill();
  f.beginPath();f.moveTo(W,H);f.lineTo(W,H*.84);f.quadraticCurveTo(W*.86,H*.79,W*.72,H*.93);f.lineTo(W*.66,H);f.fill();
  const P=[{x:W*.21,h:H*.30,l:0},{x:W*.79,h:H*.32,l:0},{x:W*.06,h:H*.56,l:1},{x:W*.94,h:H*.5,l:1}];
  P.forEach((p,i)=>{
    const w=p.h*.62,base=H*1.0;
    pine(f,p.x,base,p.h,w,i%2?'#1b4a34':'#20543a','#2a1d14');
    if(p.l){
      for(let t=0;t<6;t++){
        const g=pineTier(p.x,base,p.h,w,t),cnt=3+t;
        for(let j=0;j<cnt;j++){
          const q=(j/(cnt-1))*2-1,yl=g.by-g.step*.5+(1-q*q)*g.step*.3,hwA=g.hw*(yl-g.ay)/(g.by-g.ay);
          lights.push({x:p.x+q*.85*hwA,y:yl,c:Math.floor(r()*5),ph:r()*6,s:1});
        }
      }
      lights.push({x:p.x,y:base-p.h,c:1,ph:0,s:2.2,big:1});
    }
  });
}
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);W=innerWidth;H=innerHeight;
  cv.width=W*DPR;cv.height=H*DPR;shoreY=H*.66;U=clamp(Math.min(W,H*.9)/420,.7,1.5);build();
}
addEventListener('resize',resize);

/* ---------- estrellas, nubes, ondas ---------- */
const sr=rnd(3);
const stars=Array.from({length:260},()=>({x:sr(),y:Math.pow(sr(),1.3)*.62,r:sr()*1.3+.3,ph:sr()*6}));
const clouds=Array.from({length:6},(_,i)=>({x:sr()*1.2,y:.08+sr()*.24,s:.6+sr()*.9,v:4+sr()*8,b:Array.from({length:6},(_,k)=>({dx:(k-2.5)*26+sr()*10,dy:-Math.sin(k/5*Math.PI)*14*sr(),r:22+sr()*22}))}));
const ripples=Array.from({length:46},()=>({x:sr(),y:sr(),w:sr()*60+20,ph:sr()*6}));

/* ---------- partículas, ondas de luz, Santa ---------- */
let parts=[],waves=[],santa={on:false,t0:0,dir:1,x:0,y:0,say:0},nextLaunch=6;
function burst(x,y,col,n){for(let i=0;i<n;i++){const a=Math.random()*6.283,v=30+Math.random()*90;parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:1,d:.9+Math.random()*.8,col,r:1+Math.random()*1.6})}}
const GC=['#d8232b','#2f9e5b','#2f7fd8','#f2b632','#b04ad8'];
let gifts=[];
function dropGifts(){const now=performance.now()/1000,lh=H-shoreY;
  for(let i=0;i<3;i++)gifts.push({wait:i*.28,x:0,y:0,vx:santa.dir*70+(Math.random()-.5)*70,vy:-30,rot:0,vr:(Math.random()-.5)*8,col:GC[Math.floor(Math.random()*5)],rb:Math.random()<.5?'#ffe9a8':'#fff',ly:shoreY+(.04+Math.random()*.3)*lh,ph:Math.random()*6,tl:0,landed:false});
  burst(santa.x,santa.y+20,'#ffd447',14)}
function drawGifts(now,dt){
  const c=ctx;gifts=gifts.filter(g=>!g.landed||now-g.tl<4);
  gifts.forEach(g=>{
    if(g.wait>0){g.wait-=dt;if(g.wait<=0){g.x=santa.on?santa.x:g.x||W/2;g.y=(santa.on?santa.y:H*.2)+25;}return}
    let yy=g.y,a=1,sq=1;
    if(!g.landed){g.vy+=280*dt;g.x+=g.vx*dt;g.y+=g.vy*dt;g.rot+=g.vr*dt;yy=g.y;
      if(Math.random()<.6)parts.push({x:g.x,y:g.y,vx:(Math.random()-.5)*20,vy:5,life:1,d:.6,col:'#ffe9a8',r:1.2});
      if(g.y>=g.ly){g.landed=true;g.tl=now;g.rot=0;burst(g.x,g.ly,'#dff4ff',12)}}
    else{yy=g.ly+Math.sin(now*3+g.ph)*1.5;a=clamp(1-(now-g.tl)/4+.15);sq=.7}
    const s=(13+7*clamp((g.y-shoreY)/(H-shoreY)+.2))*U;
    c.save();c.globalAlpha=a;c.translate(g.x,yy);c.rotate(g.rot);c.scale(1,sq);
    c.fillStyle=g.col;c.fillRect(-s/2,-s/2,s,s);c.fillStyle='rgba(0,0,0,.18)';c.fillRect(0,-s/2,s/2,s);
    c.fillStyle=g.rb;c.fillRect(-s*.09,-s/2,s*.18,s);c.fillRect(-s/2,-s*.09,s,s*.18);
    c.beginPath();c.ellipse(-s*.2,-s*.6,s*.2,s*.13,-.5,0,7);c.ellipse(s*.2,-s*.6,s*.2,s*.13,.5,0,7);c.fill();
    c.restore()});
}
function launch(now){santa={on:true,t0:now,dir:Math.random()<.5?1:-1,x:0,y:0,say:0}}

function deer(c,x,y,ph,nose){
  c.save();c.translate(x,y+Math.sin(ph*.5)*3);
  c.fillStyle='#7a4b2a';c.beginPath();c.ellipse(0,0,16,8,0,0,7);c.fill();
  c.beginPath();c.moveTo(10,-4);c.lineTo(16,-13);c.lineTo(21,-9);c.lineTo(14,2);c.fill();
  c.beginPath();c.arc(19,-10,5,0,7);c.fill();
  c.strokeStyle='#5b371e';c.lineWidth=2.4;c.lineCap='round';
  c.beginPath();c.moveTo(9,5);c.lineTo(9+Math.sin(ph)*8,17);c.moveTo(13,5);c.lineTo(13+Math.sin(ph+2)*8,16);
  c.moveTo(-9,5);c.lineTo(-9+Math.sin(ph+3.1)*8,17);c.moveTo(-13,5);c.lineTo(-13+Math.sin(ph+5)*8,16);c.stroke();
  c.lineWidth=1.6;c.strokeStyle='#c9a26b';c.beginPath();c.moveTo(18,-14);c.lineTo(13,-26);c.moveTo(15,-21);c.lineTo(20,-25);c.moveTo(21,-14);c.lineTo(25,-24);c.stroke();
  c.fillStyle=nose?'#ff3030':'#3a2416';c.beginPath();c.arc(24,-9,2.2,0,7);c.fill();
  if(nose){c.globalCompositeOperation='lighter';const g=c.createRadialGradient(24,-9,0,24,-9,16);g.addColorStop(0,'rgba(255,60,60,.9)');g.addColorStop(1,'rgba(255,60,60,0)');c.fillStyle=g;c.fillRect(6,-27,36,36)}
  c.restore();
}
function drawSanta(now,n){
  const p=(now-santa.t0)/16;
  if(p>=1){santa.on=false;nextLaunch=now+45;return}
  const u=clamp(W/620,.55,1.2),d=santa.dir;
  santa.x=d>0?-300*u+(W+600*u)*p:W+300*u-(W+600*u)*p;
  santa.y=H*.17+Math.sin(p*6.283)*H*.03-Math.sin(p*Math.PI)*H*.05;
  if(!calm&&Math.random()<.7)parts.push({x:santa.x-d*40*u,y:santa.y+8*u,vx:-d*20+(Math.random()-.5)*20,vy:10+Math.random()*25,life:1,d:1.3,col:'#ffe9a8',r:1+Math.random()*1.8});
  const c=ctx;c.save();c.translate(santa.x,santa.y);c.scale(d*u,u);
  c.globalCompositeOperation='lighter';const gl=c.createRadialGradient(0,0,0,0,0,110);gl.addColorStop(0,`rgba(255,200,120,${.12+.2*n})`);gl.addColorStop(1,'rgba(255,200,120,0)');c.fillStyle=gl;c.fillRect(-110,-110,220,220);c.globalCompositeOperation='source-over';
  c.strokeStyle='#e8c15a';c.lineWidth=1;c.beginPath();c.moveTo(34,-8);
  [96,146,196].forEach((x,i)=>c.lineTo(x+8,-6-i*6));c.stroke();
  [196,146,96].forEach((x,i)=>deer(c,x,-6-(2-i)*6,now*9+i*1.3,i===0));
  c.fillStyle='#8a4a2a';c.beginPath();c.arc(-24,-22,9,0,7);c.fill();
  c.fillStyle='#c0272d';c.beginPath();c.moveTo(-34,-14);c.lineTo(34,-14);c.quadraticCurveTo(30,8,6,10);c.lineTo(-26,10);c.quadraticCurveTo(-36,6,-34,-14);c.fill();
  c.strokeStyle='#e8c15a';c.lineWidth=3;c.lineCap='round';c.beginPath();c.moveTo(-36,17);c.lineTo(30,17);c.quadraticCurveTo(46,17,44,3);c.moveTo(-20,10);c.lineTo(-20,17);c.moveTo(10,10);c.lineTo(10,17);c.stroke();
  c.fillStyle='#d8232b';c.beginPath();c.arc(-2,-22,10,0,7);c.fill();
  c.fillStyle='#f2c9a4';c.beginPath();c.arc(-2,-35,6,0,7);c.fill();
  c.fillStyle='#fff';c.beginPath();c.arc(-1,-31,5,0,3.2);c.fill();
  c.fillStyle='#d8232b';c.beginPath();c.moveTo(-9,-38);c.lineTo(5,-38);c.lineTo(1,-53);c.closePath();c.fill();
  c.fillStyle='#fff';c.beginPath();c.arc(1,-53,3,0,7);c.fill();
  c.restore();
}

/* ---------- toques ---------- */
cv.addEventListener('pointerdown',e=>{
  if(!xmasOn)return;
  const now=performance.now()/1000,x=e.clientX,y=e.clientY;
  let best=null,bd=34;
  lights.forEach(l=>{const d=Math.hypot(l.x-x,l.y-y);if(d<bd){bd=d;best=l}});
  if(best){best.c=(best.c+1)%5;burst(best.x,best.y,LC[best.c],14);waves.push({x:best.x,y:best.y,t:now});return}
  if(santa.on&&Math.hypot(santa.x-x,santa.y-y)<110){dropGifts();return}
  if(y<shoreY*.85){burst(x,y,'#ffe9a8',10);if(!santa.on)launch(now)}
});

/* ---------- tiempo (Bariloche = UTC-3 todo el año) ---------- */
function clockNow(){
  const d=new Date(Date.now()-3*3600e3),mo=d.getUTCMonth()+1,da=d.getUTCDate();
  const doy=(Date.UTC(d.getUTCFullYear(),mo-1,da)-Date.UTC(d.getUTCFullYear(),0,0))/864e5;
  const real=d.getUTCHours()+d.getUTCMinutes()/60+(d.getUTCSeconds()+d.getUTCMilliseconds()/1000)/3600;
  return{t:ovr===null?real:ovr,mo,da,doy};
}
const pad=n=>String(Math.floor(n)).padStart(2,'0');
let lastSec=-1;
function updateDOM(t){
  const sec=Math.floor(Date.now()/1000);if(sec===lastSec)return;lastSec=sec;
  let diff=Math.floor((TARGET-Date.now())/1000);
  if(diff<0)diff=0;
  $('d').textContent=Math.floor(diff/86400);$('h').textContent=pad(diff%86400/3600);$('m').textContent=pad(diff%3600/60);$('s').textContent=pad(diff%60);
  $('clock').textContent='Hora en Bariloche: '+pad(t)+':'+pad(t%1*60)+(ovr!==null?' (prueba)':'');
}
function tint(src,dst,col,k){
  const c=dst.getContext('2d');c.setTransform(1,0,0,1,0,0);c.globalCompositeOperation='source-over';c.clearRect(0,0,dst.width,dst.height);c.drawImage(src,0,0);
  c.globalCompositeOperation='source-atop';c.fillStyle=rgba([col[0],col[1],col[2],col[3]*k]);c.fillRect(0,0,dst.width,dst.height);c.globalCompositeOperation='source-over';
}

/* ---------- dibujo ---------- */
let last=performance.now()/1000;
function frame(){
  const now=performance.now()/1000,dt=Math.min(.05,now-last);last=now;
  const T=clockNow(),t=T.t;
  const auto=(T.mo===11&&T.da>=15)||T.mo===12||(T.mo===1&&T.da<=6);
  xmasOn=xmasForce!==null?xmasForce:auto;
  $('hint').classList.toggle('on',xmasOn);$('bx').setAttribute('aria-pressed',xmasOn);
  updateDOM(t);

  const half=6.2+1.4*Math.cos(2*Math.PI*(T.doy-355)/365),rise=13.3-half,set=13.3+half;
  let alt,sunP=-1,moonQ=-1;
  if(t>=rise&&t<=set){sunP=(t-rise)/(2*half);alt=Math.sin(Math.PI*sunP)}
  else{moonQ=((t-set+24)%24)/(24-2*half);alt=-Math.sin(Math.PI*moonQ)*.3}
  const night=clamp(-alt/.12,0,1);
  const top=ramp(SKYT,alt),bot=ramp(SKYB,alt),tn=ramp(TINT,alt);
  const c=ctx;c.setTransform(DPR,0,0,DPR,0,0);c.globalCompositeOperation='source-over';c.globalAlpha=1;

  let g=c.createLinearGradient(0,0,0,shoreY);g.addColorStop(0,rgba(top));g.addColorStop(1,rgba(bot));c.fillStyle=g;c.fillRect(0,0,W,H);

  // estrellas
  if(night>0){stars.forEach(s=>{c.globalAlpha=night*(.45+.55*Math.sin(now*1.6+s.ph)*.5+.25);c.fillStyle='#fff';c.beginPath();c.arc(s.x*W,s.y*shoreY,s.r,0,7);c.fill()});c.globalAlpha=1}

  // sol y luna
  const arcY=a=>shoreY-H*.05-a*H*.55;
  let sunX=0,moonX=0,sunCol=[255,240,200];
  if(sunP>=0){
    sunX=W*(.1+.8*sunP);const sy=arcY(alt),r=Math.max(24,H*.04);sunCol=mix([255,110,50],[255,244,205],clamp(alt*4));
    c.globalCompositeOperation='lighter';g=c.createRadialGradient(sunX,sy,r*.3,sunX,sy,r*7);g.addColorStop(0,rgba([...sunCol,.55]));g.addColorStop(1,rgba([...sunCol,0]));c.fillStyle=g;c.fillRect(sunX-r*7,sy-r*7,r*14,r*14);
    c.globalCompositeOperation='source-over';c.fillStyle=rgba(sunCol);c.beginPath();c.arc(sunX,sy,r,0,7);c.fill();
  }
  if(moonQ>=0){
    moonX=W*(.1+.8*moonQ);const my=arcY(Math.sin(Math.PI*moonQ)),r=Math.max(18,H*.03),a=clamp(night*1.4);
    c.globalCompositeOperation='lighter';g=c.createRadialGradient(moonX,my,r*.5,moonX,my,r*6);g.addColorStop(0,`rgba(200,215,255,${.3*a})`);g.addColorStop(1,'rgba(200,215,255,0)');c.fillStyle=g;c.fillRect(moonX-r*6,my-r*6,r*12,r*12);
    c.globalCompositeOperation='source-over';c.globalAlpha=a;c.fillStyle='#f3efd9';c.beginPath();c.arc(moonX,my,r,0,7);c.fill();
    c.fillStyle='rgba(150,150,130,.28)';[[-.3,-.25,.28],[.35,.1,.22],[-.1,.4,.18]].forEach(m=>{c.beginPath();c.arc(moonX+m[0]*r,my+m[1]*r,m[2]*r,0,7);c.fill()});c.globalAlpha=1;
  }

  // nubes
  const warm=alt>-.06?clamp(1-alt*5):0;
  const cc=mix(mix([255,255,255],[36,50,86],night),[255,170,130],warm*.55);
  clouds.forEach(cl=>{
    const cx=((cl.x*W+now*cl.v*(calm?.2:1))%(W+500))-250,cy=cl.y*shoreY;
    cl.b.forEach(b=>{const rr=b.r*cl.s,x=cx+b.dx*cl.s,y=cy+b.dy*cl.s;
      g=c.createRadialGradient(x,y,0,x,y,rr);g.addColorStop(0,rgba([...cc,.5-.22*night]));g.addColorStop(1,rgba([...cc,0]));c.fillStyle=g;c.fillRect(x-rr,y-rr,rr*2,rr*2)});
  });

  if(santa.on)drawSanta(now,night);else if(xmasOn&&!calm&&now>nextLaunch)launch(now);

  // lago
  const lt=mix(bot,[46,112,128],.55),lb=mix(top,[14,52,72],.7);
  g=c.createLinearGradient(0,shoreY,0,H);g.addColorStop(0,rgba(lt));g.addColorStop(1,rgba(lb));c.fillStyle=g;c.fillRect(0,shoreY,W,H-shoreY);
  tint(mtn,tM,tn,1);
  c.save();c.beginPath();c.rect(0,shoreY,W,H-shoreY);c.clip();c.translate(0,shoreY*2);c.scale(1,-1);c.globalAlpha=.4;c.drawImage(tM,0,0,W,H);c.restore();
  g=c.createLinearGradient(0,shoreY,0,H);g.addColorStop(0,rgba([...lt,.15]));g.addColorStop(1,rgba([...lb,.55]));c.fillStyle=g;c.fillRect(0,shoreY,W,H-shoreY);
  const lh=H-shoreY;
  c.fillStyle=rgba([...mix(bot,[255,255,255],.5),1]);
  ripples.forEach(rp=>{const yy=shoreY+Math.pow(rp.y,1.5)*lh,k=(yy-shoreY)/lh,w=rp.w*(.4+k*1.6);
    c.globalAlpha=(.05+.07*Math.sin(now*.9+rp.ph))*(1-night*.6);c.fillRect(((rp.x*1.2-.1)*W+Math.sin(now*.3+rp.ph)*10),yy,w,1.2)});
  c.globalAlpha=1;
  const glint=(x,col,a)=>{c.globalCompositeOperation='lighter';
    for(let y=shoreY+2;y<H;y+=4){const k=(y-shoreY)/lh,w=(10+110*k)*(.35+.65*Math.abs(Math.sin(y*.31+now*2.1))),jx=Math.sin(y*.13+now*1.4)*10*k;
      c.fillStyle=rgba([...col,a*(1-k*.55)]);c.fillRect(x+jx-w/2,y,w,2)}
    c.globalCompositeOperation='source-over'};
  if(sunP>=0&&alt>-.02)glint(sunX,sunCol,.4*clamp(alt*3+.25));
  if(moonQ>=0)glint(moonX,[225,232,255],.28*night);

  // montañas, cabaña
  c.drawImage(tM,0,0,W,H);
  cabins.forEach(cb=>{
    if(night>.02||alt<.15){const a=clamp(.35+night*.65),mx=cb.x+cb.w/2,my=cb.y+cb.h/2;
      c.globalCompositeOperation='lighter';g=c.createRadialGradient(mx,my,0,mx,my,cb.h*4);g.addColorStop(0,`rgba(255,180,90,${.35*a})`);g.addColorStop(1,'rgba(255,180,90,0)');c.fillStyle=g;c.fillRect(mx-cb.h*4,my-cb.h*4,cb.h*8,cb.h*8);
      c.globalCompositeOperation='source-over';c.fillStyle=`rgba(255,${190+night*10|0},110,${a})`;c.fillRect(cb.x,cb.y,cb.w,cb.h)}
    else{c.fillStyle='#31424a';c.fillRect(cb.x,cb.y,cb.w,cb.h)}
  });

  // primer plano
  tint(fgc,tF,tn,.9);c.drawImage(tF,0,0,W,H);

  // luces
  waves=waves.filter(w=>now-w.t<2.5);
  if(xmasOn){
    const vis=.5+.5*night;c.globalCompositeOperation='lighter';
    lights.forEach(l=>{
      let b=.7+.3*Math.sin(now*2+l.ph*3);
      waves.forEach(w=>{const a=now-w.t,d=Math.abs(Math.hypot(l.x-w.x,l.y-w.y)-a*520);if(d<50)b+=(1-d/50)*1.3*(1-a/2.5)});
      const col=hex(LC[l.c]),r=(3.2*l.s)*U*(l.big?1.4:1);
      g=c.createRadialGradient(l.x,l.y,0,l.x,l.y,r*5);g.addColorStop(0,rgba([...col,.75*b*vis]));g.addColorStop(1,rgba([...col,0]));c.fillStyle=g;c.fillRect(l.x-r*5,l.y-r*5,r*10,r*10);
      c.fillStyle=rgba([...mix(col,[255,255,255],clamp(b-1)),clamp(.55+.45*b*vis)]);c.beginPath();c.arc(l.x,l.y,r*.7,0,7);c.fill();
    });
    c.globalCompositeOperation='source-over';
  }
  drawGifts(now,dt);
  // partículas
  c.globalCompositeOperation='lighter';
  parts=parts.filter(p=>p.life>0);
  parts.forEach(p=>{p.life-=dt/p.d;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=40*dt;c.fillStyle=p.col;c.globalAlpha=clamp(p.life);c.beginPath();c.arc(p.x,p.y,p.r,0,7);c.fill()});
  c.globalAlpha=1;c.globalCompositeOperation='source-over';
  requestAnimationFrame(frame);
}
const hexc={};function hex(h){return hexc[h]||(hexc[h]=[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)])}

/* ---------- controles ---------- */
$('bx').onclick=()=>{xmasForce=!xmasOn;if(xmasForce&&!santa.on)nextLaunch=performance.now()/1000+1};
$('bt').onclick=()=>{const p=$('pan');p.classList.toggle('on');if(p.classList.contains('on')&&ovr===null){const d=clockNow();$('rg').value=d.t;ovr=d.t;$('hv').textContent=pad(ovr)+':'+pad(ovr%1*60)}};
$('rg').oninput=e=>{ovr=+e.target.value;$('hv').textContent=pad(ovr)+':'+pad(ovr%1*60)};
$('bn').onclick=()=>{ovr=null;$('pan').classList.remove('on')};

resize();requestAnimationFrame(frame);
</script>
</body>
